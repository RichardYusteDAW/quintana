<div class="container">
    <div class="row mt-4 border border-3 border-white rounded-3">
        <table class="table table-dark table-striped table-bordered border-white table-hover text-center align-middle">
            <thead>
                <tr>
                    <th>Video</th>
                    <th>Nombre</th>
                    <th>Link</th>
                    <th>
                        <button class="btn btn-success" (click)="startAdd()" [disabled]="!!newVideo || !!editingVideo">
                            <i class="fa-solid fa-plus"></i> Añadir
                        </button>
                    </th>
                </tr>
            </thead>

            <tbody>
                @if(newVideo) {
                <tr>
                    <td>
                        <img class="radio" src="https://i.ytimg.com/vi/{{newVideo.id}}/hqdefault.jpg"
                            alt="{{newVideo.name}}" loading="lazy">
                    </td>
                    <td>
                        <input #videoNameInput type="text" class="form-control" placeholder="Nombre del video"
                            [(ngModel)]="newVideo.name" />
                    </td>
                    <td>
                        <input #videoIdInput type="text" class="form-control"
                            placeholder="Introduce el id del video de YouTube" [(ngModel)]="newVideo.id" />
                    </td>

                    <!-- Adding Buttons -->
                    <td>
                        <div class="d-flex align-items-center justify-content-center gap-2">
                            <button class="btn btn-success" (click)="saveAdd()">
                                <i class="fa-solid fa-check"></i>
                            </button>

                            <button class="btn btn-secondary" (click)="cancelAdd()">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    </td>
                </tr>
                }

                @for(video of videos; let i = $index; track i) {
                <tr>
                    <td>
                        <img class="radio" src="https://i.ytimg.com/vi/{{video.id}}/hqdefault.jpg" alt="{{video.name}}"
                            loading="lazy">
                    </td>

                    <td>
                        <input #videoNameInput type="text" class="form-control" [value]="video.name" disabled />
                    </td>

                    <td>
                        @if (editingVideo) {
                        <input #videoIdInput type="text" class="form-control" [value]="video.id" disabled />
                        }
                        @else {
                        <a [href]="`https://www.youtube.com/watch?v=${video.id}`" class="text-info text-decoration-none"
                            target="_blank" rel="noopener noreferrer">
                            https://www.youtube.com/watch?v/{{ video.id }}
                        </a>
                        }
                    </td>

                    <!-- Editing Buttons -->
                    <td>
                        <div class="d-flex align-items-center justify-content-center gap-2">
                            @if (editingVideo?.oldName === video.name) {
                            <button class="btn btn-success" (click)="saveEdit()">
                                <i class="fa-solid fa-check"></i>
                            </button>

                            <button class="btn btn-secondary" (click)="cancelEdit()">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                            }

                            @else {
                            <button class="btn btn-primary" (click)="startEdit(video, i)" [disabled]="!!editingVideo">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="btn btn-danger" (click)="onDeleteVideo(video.id)">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                            }
                        </div>
                    </td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
