<div class="container d-flex flex-column w-50 mt-5 border border-3 border-white rounded p-4">
    <h1 class="align-self-center">Log In</h1>
    <form>
        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" [(ngModel)]="loginCredentials.email">
            @if(errors.email){ <div class="text-danger">{{ errors.email }}</div> }
        </div>
        <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                [(ngModel)]="loginCredentials.password">
            @if(errors.password){ <div class="text-danger">{{ errors.password }}</div> }
        </div>

        <button type="button" class="button" (click)="onSubmit()">
            LogIn
        </button>
    </form>
</div>
